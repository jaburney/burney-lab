# Group members, rendered by people.markdown. Order here is the display order.
#
# Current members appear as a photo grid, each with a detail modal:
#
#   id         anchor slug -- becomes /people/#person-<id>
#   role       short label shown on the grid tile
#   titles     full title line(s) shown in the modal
#   bio        one entry per paragraph; inline HTML (links) is allowed
#   education  optional -- omit entirely if not applicable
#   links      optional -- shown after the email in the contact line
#
# To move someone to the Alumni list below the grid, add:
#
#   alumni: true
#
# Alumni are plain text -- no photo, modal or contact links -- so
# photo/bio/education/email/links are ignored for them and can be deleted or
# left in place. They show the full `titles` (there is room for it outside a
# tile), falling back to `role` if titles is absent. Optionally add where they
# are now:
#
#   current:
#     text: Assistant Professor, Some University
#     url: https://example.edu/their-page      # optional; omit for plain text
#
# The Alumni heading only renders when at least one person is tagged.

- id: jen-burney
  name: Jen Burney
  photo: /images/people/jen.jpeg
  role: Principal Investigator
  titles:
    - Professor, Global Environmental Policy and Earth System Science
    - Deputy Director, Center on Food Security and the Environment
  bio:
    - >-
      Loves science ⚛️, exploring our amazing planet 🌍, and the beautiful game ⚽.
      Proud parent to the two greatest kids of all time.
    - >-
      Jen is a member of the Standing Panel on Impact Assessment
      (<a href="https://iaes.cgiar.org/spia">SPIA</a>) of the CGIAR system, the
      Food Security Leadership Council
      (<a href="https://www.foodsecurityleadership.org/">FSLC</a>), and the
      Center for Effective Global Action
      (<a href="https://cega.berkeley.edu/">CEGA</a>), where she is co-chair of
      the Digital Agricultural Innovations &amp; Services Initiative
      (<a href="https://www.povertyactionlab.org/initiative/digital-agricultural-innovations-and-services-initiative-daisi">DAISI</a>).
      Before joining the Doerr School in 2025, she spent 12 years on the faculty
      at UC San Diego's School of Global Policy and Strategy
      (<a href="https://gps.ucsd.edu/">GPS</a>) and the Scripps Institution of
      Oceanography (<a href="https://scripps.ucsd.edu/">SIO</a>), and has been a
      member of the National Geographic Explorers
      (<a href="https://www.nationalgeographic.com/culture/topic/explorer">NGS</a>)
      family since 2011.
  education: BA, Harvard College (History & Science), 1999; PhD Stanford University (Physics), 2007
  email: burney@stanford.edu
  links:
    - text: Stanford Profile
      url: https://profiles.stanford.edu/jab

- id: pascal-polonik
  name: Pascal Polonik
  photo: /images/people/pascal.jpg
  role: Research Scholar
  titles:
    - Research Scholar
  bio:
    - >-
      Pascal is a research scholar working to develop and apply statistical and
      numerical models to study the climate and social impacts of greenhouse
      gases and
      particulate matter. His research explores human-atmosphere interactions
      and tries to uncover how human decisions may alter climate and equity
      outcomes. In his free time he likes to hike with his wife and dog, run,
      bike, travel, eat, and take pictures.
  education: >-
    BS, Environmental Sciences, BA, Atmospheric Sciences, minor in Energy and
    Resources, UC Berkeley (2015); MS, Meteorology, LMU Munich (2017); PhD,
    Climate Science, Scripps Institution of Oceanography (2023)
  email: ppolonik@stanford.edu
  links:
    - text: Personal Website
      url: https://ppolonik2.github.io/
    - text: Stanford Profile
      url: https://profiles.stanford.edu/pascal-polonik

- id: yan-jiang
  name: Yan Jiang (蒋颜)
  photo: /images/people/yan.jpg
  role: Postdoctoral Scholar
  titles:
    - Postdoctoral Scholar
  bio:
    - >-
      Yan Jiang is a Hydroclimate Scientist who uses satellite remote sensing,
      climate/physical models, and advanced statistical/AI techniques to quantify
      agricultural vulnerability and improve the resilience of global water
      systems. She is currently a Postdoctoral Scholar at UC San Diego (School of
      Global Policy and Strategy &amp; Scripps Institution of Oceanography). She
      completed her degrees in Atmospheric Science from UAlbany, SUNY (Ph.D.) and
      Sun Yat-Sen University (B.S.). When she's not tracking rainfall, you might
      find her chasing her doggie, Lily, "swagging" in a bubble tea store or
      Trader Joe's, or struggling to find her way down a hiking or ski trail.
  education: BS, Atmospheric Science, Sun Yat-Sen University, China; PhD, Atmospheric Science, SUNY-Albany
  email: yaj007@ucsd.edu
  links:
    - text: Personal Website
      url: https://yjiangc.github.io/
    - text: LinkedIn
      url: https://www.linkedin.com/in/yan-jiang-474615204/
    - text: Google Scholar
      url: https://scholar.google.com/citations?user=0VPzQ-MAAAAJ&hl=en

- id: melanie-gittard
  name: Mélanie Gittard
  photo: /images/people/melanie.jpg
  role: FSE Postdoc
  titles:
    - Postdoctoral Scholar, Center on Food Security and the Environment
  bio:
    - >-
      Mélanie is an applied environmental and development economist. Her
      research examines how climate shocks affect migration, urbanization,
      agricultural production, and food security in Sub-Saharan Africa,
      alongside work on the health consequences of industrial mining and water
      pollution. She is also a Research Affiliate of the
      <a href="https://kingcenter.stanford.edu/">King Center on Global
      Development</a> at Stanford and of the International Migration Economics
      Chair at the Paris School of Economics.
  education: >-
    MS, Applied Mathematics and Engineering, Mines Nancy (2017), with a joint
    Bachelor in Economics from Lorraine University; MA, Economics -- Public
    Policy and Development, Paris School of Economics (2018); PhD, Economics,
    Paris School of Economics, CIRED and ENPC (2023)
  email: mgittard@stanford.edu
  links:
    - text: Personal Website
      url: https://melaniegittard.github.io/
    - text: Stanford Profile
      url: https://profiles.stanford.edu/melanie-gittard

