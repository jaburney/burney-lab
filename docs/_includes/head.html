<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}

  <!-- Source Sans 3 is self-hosted (see _sass/fonts.scss); preload the latin
       subset so the first paint uses it rather than the fallback. -->
  <link rel="preload" href="{{ "/assets/fonts/source-sans-3-latin.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <script>
    // Open links to other sites in a new tab. Internal links, in-page anchors,
    // and mailto:/tel: links are left alone.
    document.addEventListener('DOMContentLoaded', function () {
      var links = document.querySelectorAll('a[href]');
      for (var i = 0; i < links.length; i++) {
        var link = links[i];
        if (link.protocol !== 'http:' && link.protocol !== 'https:') continue;
        if (link.hostname === window.location.hostname) continue;
        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener noreferrer');
      }
    });
  </script>
</head>
